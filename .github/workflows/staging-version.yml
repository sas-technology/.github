# Versioning policy: every merge into `staging` is
# released as the next PATCH, tagged on the merged commit.
name: Staging version

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/reusable-staging-release.yml
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write

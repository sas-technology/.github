---
# Checks that a PR title follows Conventional Commits style
# (fix:, feat:, chore:, docs:, ...). Opt-in — call it from a repo with:
#
#   jobs:
#     pr-title:
#       uses: sas-technology/.github/.github/workflows/reusable-pr-title-lint.yml@main
name: Reusable - PR title lint

on:
  workflow_call:
    inputs:
      require-scope:
        type: boolean
        default: false
        description: 'Require a scope, e.g. "feat(api): ..."'

permissions:
  pull-requests: read

jobs:
  check:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: ${{ inputs.require-scope }}

---
# Marks and eventually closes stale issues/PRs. Opt-in — call it from
# a repo (typically on a schedule) with:
#
#   on:
#     schedule:
#       - cron: '0 1 * * *'
#   jobs:
#     stale:
#       uses: sas-technology/.github/.github/workflows/reusable-stale.yml@main
name: Reusable - Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        type: number
        default: 60
      days-before-close:
        type: number
        default: 14
      exempt-labels:
        type: string
        default: "pinned,security"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}
          stale-issue-message: >-
            This issue has had no activity in a while. It will be
            closed soon if nothing changes.
          stale-pr-message: >-
            This pull request has had no activity in a while. It will
            be closed soon if nothing changes.

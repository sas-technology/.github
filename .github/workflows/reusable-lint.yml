---
# Reusable org-wide lint gate. Any repo calls it with:
#
#   jobs:
#     lint:
#       uses: sas-technology/.github/.github/workflows/reusable-lint.yml@main
#
# It is also required org-wide, without any repo needing to add a
# caller, via the "workflows" rule in
# github-rulesets/org-wide-main-protection.json (GitHub's "required
# workflows" ruleset feature), which points at ./org-lint.yml in this
# repo. The five job names below ("lint / <job>") are the exact
# required-status-check contexts in that ruleset — renaming a job here
# means updating the ruleset too.
#
# If the calling repo doesn't have its own .markdownlint.jsonc,
# .yamllint.yaml, .prettierrc, or .prettierignore, this falls back to
# the copies in this repo instead of failing on absent config.
name: lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # actionlint errors out when a repo has no .github/workflows at all, so
      # skip the scan there; the job still runs and reports success, which
      # keeps the required "lint / actionlint" check satisfied.
      - name: Look for workflow files
        id: workflows
        run: |
          if compgen -G ".github/workflows/*.y*ml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No workflow files in this repo; nothing for actionlint to check."
          fi
      - if: steps.workflows.outputs.found == 'true'
        uses: reviewdog/action-actionlint@cfa6a621f27735ccc88d35af9d0608692fd9b9f7  # v1
        with:
          fail_level: error

  json-validity:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Validate every tracked JSON file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" >/dev/null; then
              echo "::error file=$file::Invalid JSON"
              status=1
            fi
          done < <(git ls-files -z -- '*.json' ':!:**/node_modules/**' ':!:**/*-lock.json')
          exit "$status"

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Fetch org default config (used only if this repo has none)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: sas-technology/.github
          path: .org-defaults
      - name: Seed missing config from org defaults
        run: |
          cp -n .org-defaults/.prettierrc . 2>/dev/null || true
          cp -n .org-defaults/.prettierignore . 2>/dev/null || true
          rm -rf .org-defaults
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 20
      - run: npx --yes prettier@3 --check .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Fetch org default config (used only if this repo has none)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: sas-technology/.github
          path: .org-defaults
      - name: Seed missing config from org defaults
        run: |
          cp -n .org-defaults/.markdownlint.jsonc . 2>/dev/null || true
          rm -rf .org-defaults
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25
        with:
          globs: "**/*.md"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Fetch org default config (used only if this repo has none)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: sas-technology/.github
          path: .org-defaults
      - name: Seed missing config from org defaults
        run: |
          cp -n .org-defaults/.yamllint.yaml . 2>/dev/null || true
          rm -rf .org-defaults
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml .

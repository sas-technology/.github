---
# Dependabot config for THIS repo (sas-technology/.github). Each other
# repo needs its own — see .github/dependabot.example.yml to copy from.
version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "staging"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Singapore"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
